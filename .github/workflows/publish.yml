name: Publish Package ke npm

on:
  release:
    types: [published] # Berjalan otomatis ketika Anda membuat 'Release' baru di GitHub

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org' # Menghubungkan ke registri npm resmi

      - name: Install Dependencies
        run: npm install

      - name: Publish ke npm Registry
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # Mengambil token yang disimpan di GitHub Secret
          
